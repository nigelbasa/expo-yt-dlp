# Publishes to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repo. On npmjs.com,
# the package's Settings -> Trusted publishing must list GitHub Actions with owner nigelbasa,
# repository expo-yt-dlp, workflow release.yml and no environment.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      with_ffmpeg:
        description: Bundle a mux-only ffmpeg (experimental; otherwise MediaMuxer merges)
        type: boolean
        default: false

permissions:
  contents: write  # GitHub release
  id-token: write  # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1+)
        run: npm install -g npm@^11.5.1 && npm --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }

      # Ship the newest stable yt-dlp (and the yt-dlp-ejs it pins, and certifi) even if the pins
      # in the tagged commit are older. The release notes list what was actually bundled; the
      # weekly Update bundled yt-dlp PR brings the committed pins back in line.
      - name: Use the newest stable yt-dlp
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_deps.py update --no-build --channel stable

      - name: Build ffmpeg
        if: inputs.with_ffmpeg
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/build_ffmpeg_android.sh
      - name: Build runtime
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" python scripts/build_android_runtime.py
      - name: Offline runtime tests
        run: npm run test:runtime

      - run: npm ci
      - run: npm run lint && npx jest --ci
      - run: npm run build
        env:
          CI: 1

      # --provenance links each version to this workflow run and commit (needs a public repo).
      - run: npm publish --access public --provenance

      # The Kotlin library ships the same runtime (see the maven job).
      - uses: actions/upload-artifact@v4
        with:
          name: release-runtime
          retention-days: 7
          path: |
            android/src/main/jniLibs
            android/src/main/assets/expo-yt-dlp

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - > notes.md <<'EOF'
          import json, os, re
          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          # This version's section of CHANGELOG.md, if it has one.
          section = re.search(rf'^## {re.escape(version)}\b.*?\n(.*?)(?=^## |\Z)', open('CHANGELOG.md').read(), re.M | re.S)
          if section:
              print(section.group(1).strip() + '\n')
          p = json.load(open('runtime-versions.json'))
          w = p['wheels']
          print('Bundled runtime:')
          print(f"- yt-dlp {w['yt-dlp']['version']} (yt-dlp-ejs {w['yt-dlp-ejs']['version']})")
          print(f"- Python {p['python']['version']}, QuickJS-ng {p['quickjs-ng']['version']}, certifi {w['certifi']['version']}")
          print(f"- Extractors: {', '.join(p['extractors'])} (+ generic)")
          EOF
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # The Kotlin library (io.github.nigelbasa:ytdlp-android), same version and runtime as the npm
  # package. The Maven Central token and the signing key are secrets of the maven-central
  # environment; see CONTRIBUTING.md.
  maven:
    needs: publish
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v5
        with:
          name: release-runtime
          path: android/src/main
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: gradle -p kotlin publishToMavenCentral --no-daemon --no-configuration-cache
